name: PR

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - run: npm ci --legacy-peer-deps
    - run: npm run lint
    - run: npm run build
    - run: npm test
